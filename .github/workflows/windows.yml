name: Mancala So Joga para Windows

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.pyw'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'COMO-JOGAR.txt'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  construir:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Ler versao do projeto
        id: versao
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          versao = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', versao):
              raise ValueError('Use uma versao no formato X.Y.Z')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as saida:
              saida.write(f'valor={versao}\n')
      - name: Instalar ferramenta de empacotamento
        run: python -m pip install -r requirements.txt
      - name: Testar, construir e verificar o executavel
        shell: pwsh
        run: ./scripts/empacotar_windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MancalaSoJoga-Windows-x64
          path: |
            dist/arquivo-unico/MancalaSoJoga.exe
            dist/MancalaSoJoga-Windows-x64.zip
            dist/SHA256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: diagnostico-pacote
          path: build/verificacao-*.json
          if-no-files-found: ignore

  publicar:
    needs: construir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: MancalaSoJoga-Windows-x64
          path: pacote
      - name: Publicar versao para download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_PACOTE: ${{ github.sha }}
          VERSAO: ${{ needs.construir.outputs.versao }}
        run: |
          if gh release view "v${VERSAO}" >/dev/null 2>&1; then
            echo "Versao ja publicada. O novo pacote esta nos artefatos desta execucao; incremente a versao para publicar outra release."
            exit 0
          fi
          printf '%s\n' 'Baixe MancalaSoJoga.exe e abra com dois cliques. Nao precisa instalar Python ou Git.' 'Alternativamente baixe o ZIP, que inclui o executavel e instrucoes.' 'Windows 10/11 x64. Partidas em %LOCALAPPDATA%\MancalaSoJoga\partidas_salvas.' 'Regras, menus, tutorial, computador e salvamento verificados no executavel, com Python removido do PATH.' > notas.txt
          gh release create "v${VERSAO}" pacote/arquivo-unico/MancalaSoJoga.exe pacote/MancalaSoJoga-Windows-x64.zip pacote/SHA256.txt --target "$COMMIT_PACOTE" --title "Mancala So Joga ${VERSAO}" --notes-file notas.txt
